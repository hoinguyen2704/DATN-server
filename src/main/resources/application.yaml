spring:
  application:
    name: hozitech-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.dev[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  messages:
    basename: i18n/messages
    encoding: utf-8

  output:
    ansi:
      enabled: always

  data:
    web:
      pageable:
        default-page-size: 20

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

api:
  #public api
  prefix-client: api/v1
  #admin api
  prefix-admin: admin/api/v1
security:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
jwt:
  secret-key: ${JWT_SECRET_KEY}
  # 7 days
  access-expiration: ${JWT_ACCESS_EXPIRATION:604800}
  # 30 days
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}

link:
  frontend: ${URL_FRONTEND:http://localhost:3000}

spring.cloud:
  aws:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_BUCKET_NAME:}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
