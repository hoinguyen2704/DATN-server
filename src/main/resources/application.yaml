spring:
  application:
    name: hozitech-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.dev[.properties]
      - optional:file:server/.env[.properties]
      - optional:file:server/.env.dev[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

  messages:
    basename: i18n/messages
    encoding: utf-8

  output:
    ansi:
      enabled: always

  data:
    web:
      pageable:
        default-page-size: 20

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

api:
  #public api
  prefix-client: api/v1
  #admin api
  prefix-admin: admin/api/v1
security:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
jwt:
  secret-key: ${JWT_SECRET_KEY}
  # 7 days
  access-expiration: ${JWT_ACCESS_EXPIRATION:604800}
  # 30 days
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000}

link:
  frontend: ${URL_FRONTEND:http://localhost:3000}

spring.cloud:
  aws:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket-name: ${AWS_BUCKET_NAME:}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true

payment:
  webhook:
    # Set true only for local testing when provider signatures are not available
    allow-unsigned: ${PAYMENT_WEBHOOK_ALLOW_UNSIGNED:false}
    max-timestamp-skew-seconds: ${PAYMENT_WEBHOOK_MAX_SKEW_SECONDS:300}
    # Shared fallback secret for unknown/custom providers
    default-secret: ${PAYMENT_WEBHOOK_SECRET:}
    # Provider-specific secrets
    vnpay-secret: ${VNPAY_WEBHOOK_SECRET:}
    momo-secret: ${MOMO_WEBHOOK_SECRET:}
    bank-transfer-secret: ${BANK_TRANSFER_WEBHOOK_SECRET:}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/vnpay-return}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  version: "2.1.0"
  command: pay
  expire-minutes: 15

social:
  google:
    # ISO datetime (e.g. 2026-05-12T00:00:00) to support temporary legacy fallback
    legacy-fallback-until: ${SOCIAL_GOOGLE_LEGACY_FALLBACK_UNTIL:}
